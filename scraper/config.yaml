# VibraNews — scraper configuration
# Edit this file to change what the weekly crawl looks for.

site:
  name: VibraNews
  url: https://forestbin-raman.github.io/VibraNews/   # used in the bot User-Agent

# Polite crawling
http:
  user_agent: "VibraNewsBot/1.0 (+{site_url}; weekly literature digest)"
  timeout_s: 20
  delay_s: 1.0            # pause between requests to the same publisher site
  api_delay_s: 0.2        # pause between requests to the open APIs (OpenAlex, Crossref, Europe PMC, arXiv)
  respect_robots_txt: true

# Search sources (all free, no API key needed)
sources:
  europepmc: true          # PubMed / PMC / preprints, with abstracts and affiliations
  openalex: true           # every journal (Crossref + more), with abstracts and institutions
  crossref: true           # physics & chemistry journals not in PubMed (JRS early view, Opt. Express, ...)
  arxiv: true              # physics.optics, physics.chem-ph, physics.bio-ph preprints
  max_results_per_query: 400    # arXiv
  max_europepmc: 6000           # records per run
  max_crossref_rows: 1000       # per query (Crossref maximum)
  max_openalex_per_term: 6000   # per search term

# A paper is kept if its TITLE matches any include pattern,
# or its ABSTRACT matches one at least twice. Patterns are case-insensitive regular expressions.
include:
  - '\braman\b'
  - '\bSERS\b'
  - '\bTERS\b'
  - 'surface[- ]enhanced raman'
  - 'tip[- ]enhanced raman'
  - 'stimulated raman'
  - 'coherent anti-?stokes'
  - '\bCARS\b'
  - '\bCSRS\b'
  - 'coherent raman'
  - 'vibrational (spectroscop|imaging|microscop|analysis|signature|mode|spectr)'
  - 'short-?wave infrared (spectroscop|hyperspectral|imaging)'
  - '\bSWIR (spectroscop|hyperspectral)'
  - '\bNIRS\b'
  - '\bFT-?IR\b'
  - 'infrared spectroscop'
  - 'mid-?infrared (photothermal|imaging|spectroscop)'
  - '\bO-?PTIR\b'
  - 'optical photothermal infrared'
  - '\bAFM-?IR\b'
  - 'near-?infrared spectroscop'
  - '\bIR (spectr|biotyper|imaging|microscop|absorption|band)'
  - 'infrared (imaging|microscop|absorption|spectr|biotyper)'
  - '\bATR\b.*infrared'
  - 'hyper-?raman'
  - 'brillouin (microscop|spectr|scattering|imaging|light scattering|shift|map|frequenc)'
  - 'stimulated brillouin (microscop|imaging|spectroscop)'
  - 'terahertz (spectroscop|vibration|time-domain)'
  - '\bTHz[- ](spectroscop|vibration|raman)'
  - 'low-?(frequency|wavenumber) raman'
  - 'sum[- ]frequency generation (vibrational )?spectroscop'
  - '\bSFG\b.*vibration'
  - '2D[- ]IR'
  - 'two-dimensional infrared'
  - 'femtosecond stimulated raman'
  - '\bFSRS\b'
  - 'impulsive stimulated raman'
  - 'raman optical activity'
  - 'vibrational circular dichroism'
  - '\bVCD\b'
  - '\bROA\b'
  - 'photoacoustic (infrared|IR|spectroscop)'
  - 'photothermal (micro)?spectroscop'
  - 'fourier[- ]transform photothermal'
  - 'vibrational (measurement|contrast|absorption|fingerprint|band|transition|overtone|dynamics|response|state)'
  - '(overtone|combination) (band|absorption|spectr)'
  - 'vibrational (EELS|electron energy loss)'
  - 'inelastic neutron scattering'
  - 'nuclear resonance vibrational'

# Technique names specific enough that ONE mention in the abstract is enough
strong_include:
  - 'stimulated raman'
  - 'coherent anti-?stokes'
  - '\bCARS (microscop|imaging|spectroscop)'
  - '\bSRS (microscop|imaging|spectroscop)'
  - 'coherent raman'
  - '\bSERS\b'
  - 'surface[- ]enhanced raman'
  - 'tip[- ]enhanced raman'
  - '\bTERS\b'
  - 'brillouin (microscop|spectroscop|imaging|light scattering)'
  - 'optical photothermal infrared'
  - '\bO-?PTIR\b'
  - 'mid-?infrared photothermal'
  - '\bAFM-?IR\b'
  - 'raman optical activity'
  - 'vibrational circular dichroism'
  - 'femtosecond stimulated raman'
  - 'two-dimensional infrared'
  - 'sum[- ]frequency generation (vibrational )?spectroscop'
  - 'raman[- ]activated cell sorting'
  - 'raman (microscopy|imaging|mapping)'
  - 'hyperspectral raman'
  - 'photothermal (micro)?spectroscop'
  - 'fourier[- ]transform photothermal'
  - 'localized vibrational'

# Generic infrared terms count only in the TITLE: in abstracts they are mostly routine
# characterisation ("FTIR confirmed the functional groups") rather than IR spectroscopy research
title_only:
  - '\bFT-?IR\b'
  - 'infrared spectroscop'
  - '\bATR\b'
  - 'near-?infrared spectroscop'
  - '\bNIR\b'
  - '\bNIRS\b'
  - 'infrared (absorption|spectr)'
  - '\bIR (spectr|absorption|band)'

# Mentions inside characterisation lists ("XRD, FTIR, Raman and XPS") are not counted
characterisation_list: '(?:\b(?:XRD|XPS|SEM|TEM|HRTEM|EDS|EDX|BET|TGA|DSC|UV-?vis(?:ible)?|NMR|FT-?IR|Raman|PL|AFM|ICP(?:-[A-Z]+)?|EPR|XAS|XANES|DLS|zeta)\b(?:\s*(?:spectroscopy|spectra|analysis|analyses|measurements?))?\s*(?:,|/|;|\band\b|\bor\b)\s*){2,}(?:\band\s+)?\b(?:XRD|XPS|SEM|TEM|HRTEM|EDS|EDX|BET|TGA|DSC|UV-?vis(?:ible)?|NMR|FT-?IR|Raman|PL|AFM|ICP(?:-[A-Z]+)?|EPR|XAS|XANES|DLS|zeta)\b'

# Records from data repositories are not articles
exclude_sources: ['zenodo', 'figshare', 'mendeley data', 'dryad', 'harvard dataverse', 'pangaea']

# Further topics beyond vibrational spectroscopy. A paper is included when its TITLE matches a `title`
# pattern, or its ABSTRACT mentions one `abstract` term once, unless one of the topic's `exclude` patterns applies.
extra_topics:
  - name: Photoacoustic spectroscopy
    title:
      - 'photo-?acoustic (spectroscop|spectr|gas|trace|sens|detect|cell|analy)'
      - 'opto-?acoustic spectroscop'
      - 'quartz[- ]enhanced photo-?acoustic'
      - '\bQEPAS\b'
      - 'light-induced thermo-?elastic'
      - '\bLITES\b'
      - '(spectroscopic|multispectral|mid-?infrared|vibrational) (photo|opto)-?acoustic'
      - 'photo-?acoustic (imaging|microscop)\w* of (lipid|chemical|molecul)'
    abstract:
      - 'photo-?acoustic spectroscop'
      - 'quartz[- ]enhanced photo-?acoustic'
      - '\bQEPAS\b'
      - 'light-induced thermo-?elastic spectroscop'
      - 'mid-?infrared photo-?acoustic'
      - 'vibrational photo-?acoustic'
  - name: Spectral imaging
    title:
      - 'hyper-?spectral'
      - 'multi-?spectral (imag|camera|microscop)'
      - '\bspectral imag'
      - 'chemical imaging'
      - 'imaging spectromet'
      - 'snapshot (hyper)?spectral'
      - 'spectral (camera|imager)'
      - 'compressive spectral'
    abstract:                             # hyperspectral counts only in the title
      - 'snapshot spectral imag'
      - 'computational spectral imag'
    exclude:                              # satellite / airborne remote sensing
      - 'remote sensing'
      - 'satellite'
      - 'land[- ]cover'
      - '\bUAV\b'
      - 'unmanned aerial'
      - 'airborne'
      - 'drone'
      - 'Sentinel-?2'
      - 'Landsat'
      - '\bEnMAP\b'
      - '\bPRISMA\b'
  - name: Spectrometer design
    title:
      - '\b(computational|miniaturi[sz]ed|micro|compact|on-?chip|chip-?scale|integrated|reconstructive|single[- ](detector|pixel)|snapshot|metasurface|dispersive|grating|Fourier[- ]transform|handheld|smartphone|broadband|ultra-?compact|photonic|wavemeter|speckle|planar) spectromet'
      - 'spectrometer (design|on[- ]a[- ]chip|chip)'
      - 'reconstructive spectr'
      - 'spectral reconstruction'
      - 'spectrometers?\b.*\b(design|architecture|resolution of|bandwidth)'
    abstract:
      - 'computational spectromet'
      - 'reconstructive spectromet'
      - 'miniaturi[sz]ed spectromet'
      - 'on-?chip spectromet'
      - 'chip-?scale spectromet'
      - 'metasurface spectromet'
    exclude: ['mass spectromet', '\bNMR\b', 'gamma[- ]ray', 'x-ray spectromet', 'neutron', '\bMS/MS\b', 'LC-MS', 'GC-MS']

# Core vibrational-spectroscopy journals: EVERY paper they publish is included (no keyword filter)
core_journals:
  issn: ['0377-0486', '1097-4555', '0924-2031', '1873-3697', '0967-0335', '1751-6552']
  titles: ['journal of raman spectroscopy', 'vibrational spectroscopy', 'journal of near infrared spectroscopy']

# Papers first published longer ago than this are ignored (re-indexed old papers, late corrections)
max_age_days: 180

# Drop a paper if its title or abstract matches any of these
exclude:
  - 'functional near-?infrared'          # fNIRS brain haemodynamics
  - '\bfNIRS\b'
  - 'raman amplifier'                    # telecom fibre amplifiers
  - 'raman (fiber|fibre) laser'
  - 'brillouin zone'                     # band-structure term, not spectroscopy
  - 'brillouin optical time'             # distributed fibre sensing (BOTDA/BOTDR)
  - '\bBOTD[AR]\b'
  - 'brillouin (fiber|fibre) laser'
  - 'stimulated brillouin scattering (laser|in (optical )?fib)'
  - 'terahertz (communication|antenna|wireless|6G)'
  - 'spectral energy distribution'       # astronomy
  - '\b(AGN|galax(y|ies)|exoplanet|protoplanetary|interstellar medium)\b'
  - '(?s)^(?!.*spectromet).*photodetector'   # SWIR/IR detector devices (spectrometer papers are kept)
  - 'prefrontal|cerebral oxygenation'    # fNIRS-type studies
  - 'near-?infrared (fluorescence|imaging-guided|photothermal therapy)'
  # "Raman" / "Brillouin" in an engineering or non-vibrational sense (atom optics, telecom, lidar, sensing
  # systems, spin relaxation). Physics of Raman/Brillouin lasers, SBS photonics and plasma Raman is KEPT.
  - 'stimulated raman adiabatic|\bSTIRAP\b'
  - 'atom (optics|interferomet)|cold atoms?\b'
  - 'raman lidar|\blidar\b'
  - 'distributed temperature sens'
  - '\borbach\b|single-molecule magnets?|magnetic relaxation'
  - 'quantum state transfer|privacy amplification|superadiabatic'
  - 'microwave photonic|optical vector analy|angle of arrival'
  - '(fib(er|re)|erbium-doped) (lasers?|amplifiers?)|optical (networks?|communications?)'

# Routine applications: the TITLE names an everyday analyte / product / matrix AND a standard technique
# (NIR, FTIR, SERS, hyperspectral, Raman + chemometrics). Methods papers, physics and clinical studies are unaffected.
routine_application:
  domain:
    - 'foods?\b|fruits?|\btea\b|honey|\bfish|seafood|meat|beef|pork|chicken|milk|dairy|cheese|wine|baijiu|liquor|beer|vinegar'
    - '(olive|edible|vegetable|cooking|walnut) oils?|\brice\b|wheat|\bcorn\b|maize|soybean|\bseeds?\b(?!-mediated)|cereal|flour'
    - 'tobacco|cigar|herbal|medicinal (plant|material)|ginseng|gastrodia|citrus|orange|mandarin|grapes?\b|apples?\b|potato|sugar|coffee|cocoa|chocolate|spice|\bfeed\b'
    - 'agricultur|crops?\b|orchard|plant disease|huanglongbing|soils?\b|manure|pesticide|(pesticide|drug|antibiotic|veterinary) residues?|residues? in|mycotoxin|aflatoxin|malachite green|methylene blue|rhodamine|\bdyes?\b|melamine'
    - 'adulterat|authenticat|geographical origin|freshness|quality (assessment|evaluation|grading)|grade identification|moisture content|variety identification'
    - '\bwood\b|timber|leather|textile|asphalt|\bcoals?\b|crude oil|\bcement\b|\bconcrete\b|river water|wastewater|drinking water|fishpond|cosmetic'
  method:
    - 'near[- ]?infrared|\bNIRS?\b|vis[- ]?NIR|\bSWIR\b|short-?wave infrared|FT-?IR|\bATR\b|mid-?infrared spectroscop|infrared spectroscop'
    - 'hyperspectral|multispectral|\bSERS\b|surface[- ]enhanced raman|raman|chemometric|machine learning|deep learning|neural network'

# Title-only exclusions: routine characterisation, natural-product/extract profiling, off-topic hits
exclude_title:
  - 'homo?eopath|triturat|mother tinctures?|bhasma|\bjamu\b'
  - 'phytochemi|ethnomedic|GC-?MS profiling|molecular docking'
  - '(synthesis|preparation|fabrication),? (and |crystal structure,? and )?characteri[sz]ation'
  - 'structural, (morphological|optical|electrical)|dielectric properties'
  - 'antibacterial activity|antioxidant (activity|exploration)'
  - 'pedagog|teaching and learning|islamic|\beducation\b'
  - '^comment on\b|^reply to\b'
  - '\b(stellar|circumstellar|nova|Mira variables?|hot Jupiter|spectropolarimetry|SPHEREx|exoplanets?)\b'   # astronomy

# Off-topic uses of NIR / SWIR (tissue oximetry, detector and emitter devices) are dropped
# unless the title names a vibrational technique
soft_exclude:
  patterns:
    - 'oxygenation|oximetr|h(a)?emodynamic|oxygen saturation|\bIVUS\b|intravascular|blood pressure|cerebral (near-?infrared|NIRS)|muscle oxygen'
    - 'quantum dots?|optoelectronic|light-emitting|\bLEDs?\b|photodiode|downconverter|bolometer|nanosensor|NIR-II|photothermal therapy|detector arrays?|image processing pipeline'
  unless_title: ['raman', '\bSERS\b', '\bTERS\b', 'brillouin', 'vibrational', '\bFT-?IR\b', 'mid-?infrared', 'photothermal (infrared|imaging|microscop)', 'terahertz', '\bSFG\b', '2D-IR', 'spectromet', 'photo-?acoustic spectroscop', 'lattice dynamics', 'phonon']

