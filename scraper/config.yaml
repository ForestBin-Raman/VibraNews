# Thumbnails
#   oa_figure_else_cover : open-access paper -> its own preview image (og:image, usually Fig. 1 or the
#                          graphical abstract); paywalled paper -> journal cover only. (default)
#   all                  : every paper -> its preview image; journal cover as fallback (OCT News style)
# Open-access status comes from Europe PMC / Crossref licences, checked again against OpenAlex.
# Journal covers: config `journal_covers` -> article page image if it is a cover (portrait or 'cover' in URL)
# -> journal homepage image found via OpenAlex. If nothing is found the site draws a technique glyph.
figures:
  mode: oa_figure_else_cover
  max_width: 400
  max_height: 280
  min_side_px: 120         # smaller images are treated as logos and ignored
  reject_url_patterns: ['logo', 'favicon', 'default', 'placeholder', 'sprite', 'icon', 'blank']

# Journal covers, used when an article page offers no preview image.
# Key = journal title as Crossref/Europe PMC reports it (case-insensitive) or its ISSN.
# Value = an image URL you are allowed to use. Leave empty to let the crawler try the journal homepage's og:image.
# Wiley sites (e.g. Journal of Raman Spectroscopy) answer crawlers with a Cloudflare challenge,
# so their covers must be listed here by hand if wanted.
journal_covers:
  "Annals of Biomedical Engineering": https://media.springernature.com/w316/springer-static/cover-hires/journal/10439

# Category rules. A category is added when any of its patterns matches title or abstract.
# Group names must match the site's groups: Applications, Business News, Technology, Miscellaneous.
categories:
  Technology:
    Spontaneous Raman: ['\braman (spectroscop|spectr|microscop|imaging|mapping)', 'confocal raman', 'raman microspectroscop', 'hyper-?raman']
    SRS / CARS: ['stimulated raman', 'coherent anti-?stokes', '\bCARS\b', '\bSRS\b', 'coherent raman', '\bCSRS\b', 'raman histolog']
    SERS / TERS: ['\bSERS\b', '\bTERS\b', 'surface[- ]enhanced raman', 'tip[- ]enhanced raman', 'plasmonic substrate']
    Brillouin: ['brillouin']
    IR / NIR: ['\bFT-?IR\b', 'infrared spectroscop', '\bNIR\b', 'near-?infrared', '\bATR\b']
    Photothermal IR: ['photothermal', '\bO-?PTIR\b', '\bMIP\b', '\bAFM-?IR\b']
    Photoacoustic: ['photo-?acoustic', 'opto-?acoustic', '\bQEPAS\b', 'thermo-?elastic']
    Spectral Imaging: ['hyper-?spectral', 'multi-?spectral', '\bspectral imag', 'chemical imaging', 'imaging spectromet']
    Spectrometer Design: ['computational spectromet', 'miniaturi[sz]ed spectromet', 'on-?chip spectromet', 'chip-?scale spectromet', 'reconstructive spectr', 'spectrometer design', 'compact spectromet', 'spectral reconstruction', 'metasurface spectromet']
    THz & Low-Frequency: ['terahertz', '\bTHz\b', 'low-?(frequency|wavenumber) raman', 'phonon mode']
    Ultrafast & SFG: ['sum[- ]frequency', '\bSFG\b', '2D[- ]IR', 'two-dimensional infrared', 'femtosecond stimulated raman', '\bFSRS\b', 'impulsive stimulated raman', 'pump[- ]probe', 'ultrafast vibrational']
    Chiral (ROA / VCD): ['raman optical activity', 'vibrational circular dichroism', '\bROA\b', '\bVCD\b']
    Other Vibrational: ['vibrational (EELS|electron energy loss)', 'inelastic neutron', 'nuclear resonance vibrational', '\bIETS\b']
    Data Analysis & AI: ['machine learning', 'deep learning', 'neural network', 'chemometric', '\bPCA\b', 'random forest', 'transformer', 'denois', 'preprocessing']
