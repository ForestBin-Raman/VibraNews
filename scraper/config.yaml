# VibraNews — scraper configuration
# Edit this file to change what the weekly crawl looks for.

site:
  name: VibraNews
  url: https://forestbin-raman.github.io/VibraNews/   # used in the bot User-Agent

# Polite crawling
http:
  user_agent: "VibraNewsBot/1.0 (+{site_url}; weekly literature digest)"
  timeout_s: 20
  delay_s: 1.0            # pause between requests to the same publisher site
  api_delay_s: 0.2        # pause between requests to the open APIs (OpenAlex, Crossref, Europe PMC, arXiv)
  respect_robots_txt: true

# Search sources (all free, no API key needed)
sources:
  europepmc: true          # PubMed / PMC / preprints, with abstracts and affiliations
  openalex: true           # every journal (Crossref + more), with abstracts and institutions
  crossref: true           # physics & chemistry journals not in PubMed (JRS early view, Opt. Express, ...)
  arxiv: true              # physics.optics, physics.chem-ph, physics.bio-ph preprints
  max_results_per_query: 400    # arXiv
  max_europepmc: 6000           # records per run
  max_crossref_rows: 1000       # per query (Crossref maximum)
  max_openalex_per_term: 6000   # per search term

# A paper is kept if its TITLE matches any include pattern,
# or its ABSTRACT matches one at least twice. Patterns are case-insensitive regular expressions.
include:
  - '\braman\b'
  - '\bSERS\b'
  - '\bTERS\b'
  - 'surface[- ]enhanced raman'
  - 'tip[- ]enhanced raman'
  - 'stimulated raman'
  - 'coherent anti-?stokes'
  - '\bCARS\b'
  - '\bCSRS\b'
  - 'coherent raman'
  - 'vibrational (spectroscop|imaging|microscop|analysis|signature|mode|spectr)'
  - 'short-?wave infrared (spectroscop|hyperspectral|imaging)'
  - '\bSWIR (spectroscop|hyperspectral)'
  - '\bNIRS\b'
  - '\bFT-?IR\b'
  - 'infrared spectroscop'
  - 'mid-?infrared (photothermal|imaging|spectroscop)'
  - '\bO-?PTIR\b'
  - 'optical photothermal infrared'
  - '\bAFM-?IR\b'
  - 'near-?infrared spectroscop'
  - '\bIR (spectr|biotyper|imaging|microscop|absorption|band)'
  - 'infrared (imaging|microscop|absorption|spectr|biotyper)'
  - '\bATR\b.*infrared'
  - 'hyper-?raman'
  - 'brillouin (microscop|spectr|scattering|imaging|light scattering|shift|map|frequenc)'
  - 'stimulated brillouin (microscop|imaging|spectroscop)'
  - 'terahertz (spectroscop|vibration|time-domain)'
  - '\bTHz[- ](spectroscop|vibration|raman)'
  - 'low-?(frequency|wavenumber) raman'
  - 'sum[- ]frequency generation (vibrational )?spectroscop'
  - '\bSFG\b.*vibration'
  - '2D[- ]IR'
  - 'two-dimensional infrared'
  - 'femtosecond stimulated raman'
  - '\bFSRS\b'
  - 'impulsive stimulated raman'
  - 'raman optical activity'
  - 'vibrational circular dichroism'
  - '\bVCD\b'
  - '\bROA\b'
  - 'photoacoustic (infrared|IR|spectroscop)'
  - 'vibrational (EELS|electron energy loss)'
  - 'inelastic neutron scattering'
  - 'nuclear resonance vibrational'

# Technique names specific enough that ONE mention in the abstract is enough
strong_include:
  - 'stimulated raman'
  - 'coherent anti-?stokes'
  - '\bCARS (microscop|imaging|spectroscop)'
  - '\bSRS (microscop|imaging|spectroscop)'
  - 'coherent raman'
  - '\bSERS\b'
  - 'surface[- ]enhanced raman'
  - 'tip[- ]enhanced raman'
  - '\bTERS\b'
  - 'brillouin (microscop|spectroscop|imaging|light scattering)'
  - 'optical photothermal infrared'
  - '\bO-?PTIR\b'
  - 'mid-?infrared photothermal'
  - '\bAFM-?IR\b'
  - 'raman optical activity'
  - 'vibrational circular dichroism'
  - 'femtosecond stimulated raman'
  - 'two-dimensional infrared'
  - 'sum[- ]frequency generation (vibrational )?spectroscop'
  - 'raman[- ]activated cell sorting'
  - 'raman (microscopy|imaging|mapping)'
  - 'hyperspectral raman'

# Generic infrared terms count only in the TITLE: in abstracts they are mostly routine
# characterisation ("FTIR confirmed the functional groups") rather than IR spectroscopy research
title_only:
  - '\bFT-?IR\b'
  - 'infrared spectroscop'
  - '\bATR\b'
  - 'near-?infrared spectroscop'
  - '\bNIR\b'
  - '\bNIRS\b'
  - 'infrared (absorption|spectr)'
  - '\bIR (spectr|absorption|band)'

# Mentions inside characterisation lists ("XRD, FTIR, Raman and XPS") are not counted
characterisation_list: '(?:\b(?:XRD|XPS|SEM|TEM|HRTEM|EDS|EDX|BET|TGA|DSC|UV-?vis(?:ible)?|NMR|FT-?IR|Raman|PL|AFM|ICP(?:-[A-Z]+)?|EPR|XAS|XANES|DLS|zeta)\b(?:\s*(?:spectroscopy|spectra|analysis|analyses|measurements?))?\s*(?:,|/|;|\band\b|\bor\b)\s*){2,}(?:\band\s+)?\b(?:XRD|XPS|SEM|TEM|HRTEM|EDS|EDX|BET|TGA|DSC|UV-?vis(?:ible)?|NMR|FT-?IR|Raman|PL|AFM|ICP(?:-[A-Z]+)?|EPR|XAS|XANES|DLS|zeta)\b'

# Records from data repositories are not articles
exclude_sources: ['zenodo', 'figshare', 'mendeley data', 'dryad', 'harvard dataverse', 'pangaea']

# Core vibrational-spectroscopy journals: EVERY paper they publish is included (no keyword filter)
core_journals:
  issn: ['0377-0486', '1097-4555', '0924-2031', '1873-3697', '0967-0335', '1751-6552']
  titles: ['journal of raman spectroscopy', 'vibrational spectroscopy', 'journal of near infrared spectroscopy']

# Papers first published longer ago than this are ignored (re-indexed old papers, late corrections)
max_age_days: 180

# Drop a paper if its title or abstract matches any of these
exclude:
  - 'functional near-?infrared'          # fNIRS brain haemodynamics
  - '\bfNIRS\b'
  - 'raman amplifier'                    # telecom fibre amplifiers
  - 'raman (fiber|fibre) laser'
  - 'brillouin zone'                     # band-structure term, not spectroscopy
  - 'brillouin optical time'             # distributed fibre sensing (BOTDA/BOTDR)
  - '\bBOTD[AR]\b'
  - 'brillouin (fiber|fibre) laser'
  - 'stimulated brillouin scattering (laser|in (optical )?fib)'
  - 'terahertz (communication|antenna|wireless|6G)'
  - 'spectral energy distribution'       # astronomy
  - '\b(AGN|galax(y|ies)|exoplanet|protoplanetary|interstellar medium)\b'
  - 'photodetector'                      # SWIR/IR detector devices
  - 'prefrontal|cerebral oxygenation'    # fNIRS-type studies
  - 'near-?infrared (fluorescence|imaging-guided|photothermal therapy)'

# Europe PMC search terms (combined with OR, searched in title + abstract)
europepmc_terms:
  - raman
  - '"surface-enhanced raman"'
  - '"stimulated raman"'
  - '"coherent anti-stokes"'
  - '"coherent raman"'
  - '"infrared spectroscopy"'
  - FTIR
  - '"mid-infrared photothermal"'
  - '"optical photothermal infrared"'
  - '"vibrational spectroscopy"'
  - '"vibrational imaging"'
  - '"brillouin microscopy"'
  - '"brillouin spectroscopy"'
  - '"brillouin scattering"'
  - '"terahertz spectroscopy"'
  - '"low-frequency raman"'
  - '"sum frequency generation"'
  - '"two-dimensional infrared"'
  - '"femtosecond stimulated raman"'
  - '"raman optical activity"'
  - '"vibrational circular dichroism"'
  - '"photoacoustic spectroscopy"'

# OpenAlex title+abstract searches (each paginated in full for the look-back window)
openalex_terms:
  - raman
  - surface enhanced raman
  - stimulated raman
  - coherent anti-stokes raman
  - brillouin microscopy
  - brillouin scattering
  - infrared spectroscopy
  - FTIR
  - photothermal infrared
  - terahertz spectroscopy
  - sum frequency generation spectroscopy
  - two-dimensional infrared
  - vibrational spectroscopy
  - vibrational circular dichroism
  - raman optical activity
# OpenAlex is searched by publication date, so it looks back further to catch late-indexed papers
openalex_lookback_days: 30

# Crossref query strings (Crossref search is fuzzy; results are then filtered by `include`)
crossref_queries:
  - raman spectroscopy
  - stimulated raman scattering
  - coherent anti-stokes raman
  - surface-enhanced raman
  - tip-enhanced raman
  - infrared spectroscopy
  - mid-infrared photothermal
  - vibrational spectroscopy
  - FTIR
  - brillouin microscopy
  - brillouin light scattering
  - terahertz spectroscopy
  - sum frequency generation spectroscopy
  - two-dimensional infrared spectroscopy
  - femtosecond stimulated raman
  - raman optical activity
  - vibrational circular dichroism

# arXiv abstract search terms
arxiv_terms:
  - raman
  - '"stimulated raman"'
  - '"infrared spectroscopy"'
  - '"vibrational spectroscopy"'
  - '"mid-infrared photothermal"'
  - SERS
  - '"brillouin microscopy"'
  - '"brillouin spectroscopy"'
  - '"terahertz spectroscopy"'
  - '"sum frequency generation"'
  - '"two-dimensional infrared"'

arxiv_categories: [physics.optics, physics.chem-ph, physics.bio-ph, cond-mat.mtrl-sci, q-bio.QM]

# Thumbnails
#   oa_figure_else_cover : open-access paper -> its own preview image (og:image, usually Fig. 1 or the
#                          graphical abstract); paywalled paper -> journal cover only. (default)
#   all                  : every paper -> its preview image; journal cover as fallback (OCT News style)
# Open-access status comes from Europe PMC / Crossref licences, checked again against OpenAlex.
# Journal covers: config `journal_covers` -> article page image if it is a cover (portrait or 'cover' in URL)
# -> journal homepage image found via OpenAlex. If nothing is found the site draws a technique glyph.
figures:
  mode: oa_figure_else_cover
  max_width: 400
  max_height: 280
  min_side_px: 120         # smaller images are treated as logos and ignored
  reject_url_patterns: ['logo', 'favicon', 'default', 'placeholder', 'sprite', 'icon', 'blank']

# Journal covers, used when an article page offers no preview image.
# Key = journal title as Crossref/Europe PMC reports it (case-insensitive) or its ISSN.
# Value = an image URL you are allowed to use. Leave empty to let the crawler try the journal homepage's og:image.
# Wiley sites (e.g. Journal of Raman Spectroscopy) answer crawlers with a Cloudflare challenge,
# so their covers must be listed here by hand if wanted.
journal_covers:
  "Annals of Biomedical Engineering": https://media.springernature.com/w316/springer-static/cover-hires/journal/10439

# Category rules. A category is added when any of its patterns matches title or abstract.
# Group names must match the site's groups: Applications, Business News, Technology, Miscellaneous.
categories:
  Technology:
    Spontaneous Raman: ['\braman (spectroscop|spectr|microscop|imaging|mapping)', 'confocal raman', 'raman microspectroscop', 'hyper-?raman']
    SRS / CARS: ['stimulated raman', 'coherent anti-?stokes', '\bCARS\b', '\bSRS\b', 'coherent raman', '\bCSRS\b', 'raman histolog']
    SERS / TERS: ['\bSERS\b', '\bTERS\b', 'surface[- ]enhanced raman', 'tip[- ]enhanced raman', 'plasmonic substrate']
    Brillouin: ['brillouin']
    IR / NIR: ['\bFT-?IR\b', 'infrared spectroscop', '\bNIR\b', 'near-?infrared', '\bATR\b']
    Photothermal IR: ['photothermal', '\bO-?PTIR\b', '\bMIP\b', '\bAFM-?IR\b', 'photoacoustic']
    THz & Low-Frequency: ['terahertz', '\bTHz\b', 'low-?(frequency|wavenumber) raman', 'phonon mode']
    Ultrafast & SFG: ['sum[- ]frequency', '\bSFG\b', '2D[- ]IR', 'two-dimensional infrared', 'femtosecond stimulated raman', '\bFSRS\b', 'impulsive stimulated raman', 'pump[- ]probe', 'ultrafast vibrational']
    Chiral (ROA / VCD): ['raman optical activity', 'vibrational circular dichroism', '\bROA\b', '\bVCD\b']
    Other Vibrational: ['vibrational (EELS|electron energy loss)', 'inelastic neutron', 'nuclear resonance vibrational', '\bIETS\b']
    Data Analysis & AI: ['machine learning', 'deep learning', 'neural network', 'chemometric', '\bPCA\b', 'random forest', 'transformer', 'denois', 'preprocessing']
    General Technology: ['instrument', 'spectrometer', 'laser source', 'detector', 'optical design', 'phase[- ]matching', 'fiber probe', 'fibre probe']
  Applications:
    Art & Heritage: ['heritage', 'pigment', 'painting', 'archaeolog', 'manuscript']
    Bacteriology: ['bacteri', 'pathogen', 'microb', 'antibiotic']
    Biomechanics: ['stiffness', 'elastic modul', 'viscoelastic', 'mechanical propert', 'biomechanic']
    Cell Biology: ['live cell', 'living cell', 'single[- ]cell', 'lipid droplet', 'organelle', 'metabolism']
    Dermatology: ['skin', 'derma', 'melanoma']
    Environmental: ['microplastic', 'nanoplastic', 'environment', 'pollut', 'water quality']
    Food & Agriculture: ['food', 'agricultur', 'crop', 'leaf', 'fruit', 'meat', 'milk', 'pesticide']
    Forensics: ['forensic', 'explosive', 'nerve agent', 'counterfeit', 'drug of abuse']
    Materials: ['perovskite', 'graphene', 'polymer', 'catalys', 'battery', 'semiconductor', 'thin film', '2D material']
    Nephrology: ['kidney', 'renal', 'urine']
    Neurology: ['brain', 'neur', 'glioma', 'myelin', 'alzheimer', 'parkinson']
    Oncology: ['cancer', 'tumou?r', 'oncolog', 'carcinoma', 'metasta']
    Pharmaceutics: ['pharma', 'drug formulation', 'bioprocess', 'tablet', 'active pharmaceutical']
  Miscellaneous:
    Reviews: ['^review', '\breview of\b', 'a review', 'perspective', 'tutorial']

# Daily mode: how many days back each daily run looks. Europe PMC is searched by the date the record
# entered the database (CREATION_DATE), Crossref by DOI registration date, so late-indexed papers are caught.
daily_lookback_days: 3

# How long the trimmed abstract shown on the site may be (characters)
summary_max_chars: 700
