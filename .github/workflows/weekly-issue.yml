name: Weekly issue (draft for review)

on:
  schedule:
    - cron: "17 23 * * 0"     # Sunday 23:17 UTC = Monday 07:17 Singapore time
  workflow_dispatch:
    inputs:
      issue_date:
        description: "Issue date YYYY-MM-DD (blank = this week's Monday)"
        required: false
      since:
        description: "Window start YYYY-MM-DD (blank = issue date minus 7 days)"
        required: false
      until:
        description: "Window end YYYY-MM-DD (blank = day before issue date)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-issue
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install
        run: pip install -r scraper/requirements.txt pytest

      - name: Self-test (offline)
        run: python -m pytest -q scraper/tests

      - name: Crawl this week's papers
        id: scrape
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          args=()
          [ -n "$ISSUE_DATE" ] && args+=(--issue-date "$ISSUE_DATE")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          python scraper/vibspec_scraper.py "${args[@]}" | tee scrape-output.txt
          grep -E '^(ISSUE_ID|ISSUE_NUMBER|ADDED)=' scrape-output.txt >> "$GITHUB_OUTPUT"

      - name: Open pull request with the draft issue
        uses: peter-evans/create-pull-request@v6
        with:
          branch: issue/${{ steps.scrape.outputs.ISSUE_ID }}
          delete-branch: true
          add-paths: |
            data/**
            figs/**
            covers/**
          commit-message: "Draft issue No. ${{ steps.scrape.outputs.ISSUE_NUMBER }} (${{ steps.scrape.outputs.ISSUE_ID }})"
          title: "VibSpec News No. ${{ steps.scrape.outputs.ISSUE_NUMBER }} · ${{ steps.scrape.outputs.ISSUE_ID }} — draft for review"
          labels: draft-issue
          body: |
            The weekly crawl found **${{ steps.scrape.outputs.ADDED }}** new papers for issue **${{ steps.scrape.outputs.ISSUE_ID }}**.

            Before merging, edit `data/issues/${{ steps.scrape.outputs.ISSUE_ID }}.json` (the pencil icon on the file in this PR works on a phone):

            - [ ] Remove papers that don't belong: delete the article and add its `id` to `"removed"` so the crawler never re-adds it
            - [ ] Pick one Feature of the Week: `"feature": true`, and write a line in `"why"`
            - [ ] Mark Editor's Picks: `"pick": true`
            - [ ] Check categories, institutions and the trimmed abstracts (`"summary"`)
            - [ ] Glance at thumbnails in `figs/` and `covers/`

            Merging publishes the issue to GitHub Pages automatically.
